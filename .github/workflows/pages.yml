name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.pages-deploy-status.json'
  pull_request_target:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record deployment result
        if: ${{ always() && github.event_name == 'pull_request_target' }}
        shell: bash
        run: |
          cat > .pages-deploy-status.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "configure": "${{ steps.configure.outcome }}",
            "upload": "${{ steps.upload.outcome }}",
            "deployment": "${{ steps.deployment.outcome }}",
            "page_url": "${{ steps.deployment.outputs.page_url }}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages-deploy-status.json
          git commit -m 'Record GitHub Pages deployment result' || exit 0
          git push origin HEAD:main
