name: Enable GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable workflow-based Pages publishing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/pages"
          common=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10")
          get_status=$(curl -sS -o pages-get.json -w '%{http_code}' -L "${common[@]}" "$api")
          if [ "$get_status" = "200" ]; then
            status=$(curl -sS -o pages-write.json -w '%{http_code}' -L -X PUT "${common[@]}" "$api" -d '{"build_type":"workflow"}')
            test "$status" = "204"
          elif [ "$get_status" = "404" ]; then
            status=$(curl -sS -o pages-write.json -w '%{http_code}' -L -X POST "${common[@]}" "$api" -d '{"build_type":"workflow"}')
            test "$status" = "201"
          else
            cat pages-get.json
            exit 1
          fi
          echo "Pages API status: ${status}"
