name: Dispatch Pages deployment

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch main Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o dispatch-response.json -w '%{http_code}' \
            -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$status" != '204' ]; then
            cat dispatch-response.json
            exit 1
          fi
