name: Bootstrap and deploy travel guide

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          printf '.pages-site/\nsite.zip\nsite.zip.b64\n' >> .git/info/exclude
          cat \
            .bootstrap/site.part.00 \
            .bootstrap/site.part.01 \
            .bootstrap/site.part.02 \
            .bootstrap/site.part.03a \
            .bootstrap/site.part.03b \
            .bootstrap/site.part.04 \
            | tr -d '\r\n\t ' > site.zip.b64
          test "$(wc -c < site.zip.b64)" -eq 56416

      - name: Verify uploaded chunks
        shell: bash
        run: echo '301adf225df61c4d0cdcba2e4882cb37961aea313affbc2978c7e03e558b0ef3  site.zip.b64' | sha256sum -c -

      - name: Decode archive
        shell: bash
        run: base64 --decode site.zip.b64 > site.zip

      - name: Verify ZIP archive
        shell: bash
        run: |
          echo 'e4f49ebe2158906d345f9cc96e10fde556e60a3f1b059de02822575f8369ecf7  site.zip' | sha256sum -c -
          unzip -t site.zip

      - name: Extract website source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site /tmp/travel-map-guide-unpack
          mkdir -p .pages-site /tmp/travel-map-guide-unpack
          unzip -q site.zip -d /tmp/travel-map-guide-unpack
          cp -a /tmp/travel-map-guide-unpack/travel-map-guide-repo/. .pages-site/
          sed -i 's#app1905.github.io#kuangzg.github.io#g' .pages-site/README.md

      - name: Commit website source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cp .pages-site/index.html index.html
          cp .pages-site/README.md README.md
          cp .pages-site/LICENSE LICENSE
          cp .pages-site/.nojekyll .nojekyll
          cp -a .pages-site/data/. data/
          git rm -r .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md LICENSE .nojekyll data
          if ! git diff --cached --quiet; then
            git commit -m 'Publish travel map guide source'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
